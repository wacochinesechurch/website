# Build settings for Netlify. Kept so the site still deploys there unchanged
# if it ever moves back.
#
# Headers and redirects deliberately do NOT live here any more. They are in
# public/_headers and public/_redirects, which Netlify and Cloudflare Pages
# both read, so there is one copy of each rule instead of two that drift.
# The Node version is in .node-version, which both hosts read as well.

[build]
  command = "npm run build"
  publish = "dist"
