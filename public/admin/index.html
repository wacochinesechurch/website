<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Edit the website · 编辑网站 · Waco Chinese Church</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; background: #f8f4ed; }
      /* Shown only until the editor finishes loading. */
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        padding: 2rem; text-align: center; color: #4a4038;
        font-family: 'Source Serif 4', Georgia, 'Songti SC', serif;
        /* This covers the whole viewport. If the removal below ever fails
           again, it must not be able to swallow the clicks meant for the
           editor underneath it. */
        pointer-events: none;
      }
      #boot p { max-width: 30rem; line-height: 1.7; }
      #boot strong { display: block; font-size: 1.3rem; margin-bottom: 0.6rem; color: #211c17; }
      #boot span { display: block; margin-top: 0.4rem; color: #6b5e53; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div id="boot">
      <p>
        <strong>Loading the editor… 正在载入编辑器…</strong>
        <span>If this message stays on screen, the sign-in settings may not be
          configured yet. See <code>docs/HANDOVER.md</code>.</span>
      </p>
    </div>

    <!--
      Sveltia CMS — a drop-in, actively maintained replacement for Decap CMS
      (formerly Netlify CMS). It reads public/admin/config.yml, and commits
      every change straight to the repository as Markdown and YAML.

      Nothing about the church's content depends on this script continuing to
      exist: if it ever went away, every word would still be sitting in plain
      files in the repo, and any other Git-based CMS could read the same config.
    -->
    <!--
      Pinned deliberately. @sveltia/cms is a 0.x package, so a minor bump is
      allowed to break things, and nobody here is watching for that. An
      unpinned URL means the editor can stop working on a morning when not one
      line of this repository changed, with no way to tell what happened.
      To upgrade: read the release notes, raise the number, check /admin loads
      and that a test edit saves.

      type="module" is deliberately absent — the bundle is a classic script,
      and Sveltia logs a warning asking for the attribute to be removed.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.220.0/dist/sveltia-cms.js"></script>

    <script>
      // Remove the notice as soon as the editor actually mounts.
      //
      // This used to look for '#nc-root, #app, .sveltia-cms'. Sveltia mounts as
      // <div class="sui app-shell">, so the selector never matched and a
      // full-viewport overlay stayed on the page forever, on top of the very
      // editor it was announcing. Rather than swap one guessed class name for
      // another that the next release can rename, watch for ANY element
      // arriving in <body> that is not this notice or a script — that is the
      // editor, whatever it ends up calling itself.
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var mounted = function () {
          return [].some.call(document.body.children, function (el) {
            return el !== boot && el.tagName !== 'SCRIPT';
          });
        };
        var done = function () { if (boot && boot.parentNode) boot.remove(); };
        if (mounted()) return done();
        var obs = new MutationObserver(function () {
          if (mounted()) { obs.disconnect(); done(); }
        });
        obs.observe(document.body, { childList: true });
        // If the editor never arrives, the notice has to stay — it is the only
        // thing that tells a volunteer the script failed to load at all.
      })();
    </script>
  </body>
</html>
