# =============================================================================
# WACO CHINESE CHURCH — CONTENT MANAGEMENT
#
# This powers the editing interface at /admin. It is read by Sveltia CMS,
# which is a drop-in replacement for Decap CMS (formerly Netlify CMS) — the
# same config format, but actively maintained and much faster.
#
# WHY THIS AND NOT A HOSTED CMS
#
#   - It is free, permanently. No monthly bill a future treasurer has to
#     justify, and no vendor who can raise prices or shut down.
#   - Content is plain Markdown and YAML committed to the repository. If this
#     tool disappears tomorrow, every word the church has written is still
#     there in readable files.
#   - There is no database to back up, migrate or have breached.
#
# HOW BILINGUAL EDITING WORKS HERE
#
# Each translatable field is an object with an English and a Chinese box,
# shown together on one screen. A volunteer creating an event fills in one
# form and gets both language versions of the site. There is no way to
# publish an event in English and forget the Chinese, which is the single
# most common way a bilingual church site decays.
# =============================================================================

backend:
  name: github
  # If the org or repo name differs, change this one line and redeploy.
  repo: wacochinesechurch/website
  branch: main
  # Only offer the "Sign in with an access token" button.
  #
  # The other button, "Sign in with GitHub", cannot work until the OAuth
  # Worker described below exists and base_url points at it. Until then it
  # opens a popup that says only "Not Found", which reads like a broken site
  # rather than a missing setting. Hiding it removes the dead end.
  #
  # Delete this line once base_url is set, to bring the GitHub button back.
  # The list may not be empty — that is a configuration error.
  auth_methods: [token]
  # Volunteers sign in with a free GitHub account.
  #
  # The site is on Cloudflare Pages, so the CMS needs its own OAuth helper.
  # With no base_url, Sveltia falls back to Netlify's free broker at
  # api.netlify.com/auth. That broker is still running, but it only brokers
  # for domains registered to a Netlify site, and it is asked about
  # wacochinesechurch.pages.dev — which Netlify has never heard of. So it
  # answers 404 "Not Found". Nothing was decommissioned; this site was simply
  # never one it could serve, and moving to Cloudflare did not change that.
  #
  # The replacement is sveltia-cms-auth, a small Cloudflare Worker that the
  # same Cloudflare account can host:
  #
  #   1. Deploy https://github.com/sveltia/sveltia-cms-auth (one command, its
  #      README covers it). It lands on a URL like
  #      https://sveltia-cms-auth.<subdomain>.workers.dev
  #   2. Register a GitHub OAuth app at
  #      https://github.com/settings/applications/new
  #        Application name:  Waco Chinese Church CMS
  #        Homepage URL:      https://www.wacochinesechurch.org
  #        Callback URL:      <worker URL>/callback      <- exactly this
  #   3. Put the client id and secret into the Worker's environment variables,
  #      as its README describes. They never enter this repository.
  #   4. Uncomment base_url below and point it at the Worker.
  #
  # Until that is done /admin loads but nobody can sign in, which is the state
  # it has always been in. Editing content by hand in the repo still works.
  # base_url: https://sveltia-cms-auth.YOUR-SUBDOMAIN.workers.dev

# Lets an editor preview changes on a branch before they go live.
# Do not write `null` for an optional field a volunteer left alone.
#
# Sveltia's default is to write it. Its object-field default generator does
#   if (!required || Array.isArray(types)) { content[keyPath] = null }
# and with this flag off that null is serialized straight into the file. Astro
# validates content with Zod, whose .optional() accepts only `undefined`, so
# the build then stops with "Expected object, received null" — triggered by a
# volunteer simply not filling in a field the form told them was optional.
#
# With this on, the key is omitted instead. src/content.config.ts also accepts
# null directly, because this flag is a third-party default we do not control
# and because it cannot help files written before it was set.
output:
  omit_empty_optional_fields: true

publish_mode: editorial_workflow

# The church's 15 photographs live in src/assets/moments. Pointing the picker
# at src/assets/uploads — which does not exist — showed volunteers an empty
# library with no hint that the photos were one directory away.
# src/lib/images.ts resolves either folder and strips either prefix, so
# uploads keep working.
media_folder: src/assets/moments
public_folder: /src/assets/moments

# `locale:` is deliberately absent. Sveltia ignores it and says so in the
# console; it follows the browser's language instead, which is why the
# sign-in screen appears in Chinese on a Chinese browser. For this church
# that is the behaviour we want anyway.

# Shown at the top of the editing interface.
# These drive the CMS's "View site" link, so they have to point at what the
# editor is actually editing. www.wacochinesechurch.org still serves the OLD
# Squarespace site — sending a volunteer there to check their change meant
# sending them to a site that had never heard of it.
# AT GO-LIVE: change both back to https://www.wacochinesechurch.org
site_url: https://wacochinesechurch.pages.dev
display_url: https://wacochinesechurch.pages.dev
logo_url: /favicon.svg

# --- reusable field shapes ---------------------------------------------------
# YAML anchors keep this file readable; the CMS sees them fully expanded.
en_zh_text: &en_zh_text
  widget: object
  collapsed: false
  fields:
    - { name: en, label: 'English', widget: string, required: false }
    - { name: zh, label: '中文', widget: string, required: false }

en_zh_long: &en_zh_long
  widget: object
  collapsed: false
  fields:
    - { name: en, label: 'English', widget: text, required: false }
    - { name: zh, label: '中文', widget: text, required: false }

en_zh_markdown: &en_zh_markdown
  widget: object
  collapsed: false
  fields:
    - { name: en, label: 'English', widget: markdown, required: false }
    - { name: zh, label: '中文', widget: markdown, required: false }

# Strict variants: BOTH languages required. The content schema's `bi` type
# demands both, so a field left half-filled here does not degrade gracefully —
# it fails the next build, with an error the volunteer who caused it never
# sees. Used for every bilingual field the schema treats as required.
en_zh_text_both: &en_zh_text_both
  widget: object
  collapsed: false
  fields:
    - { name: en, label: 'English', widget: string, required: true }
    - { name: zh, label: '中文', widget: string, required: true }

en_zh_long_both: &en_zh_long_both
  widget: object
  collapsed: false
  fields:
    - { name: en, label: 'English', widget: text, required: true }
    - { name: zh, label: '中文', widget: text, required: true }

en_zh_markdown_both: &en_zh_markdown_both
  widget: object
  collapsed: false
  fields:
    - { name: en, label: 'English', widget: markdown, required: true }
    - { name: zh, label: '中文', widget: markdown, required: true }

verification_field: &verification
  name: status
  label: 'Confirmed?'
  widget: select
  default: verified
  options:
    - { label: 'Confirmed — safe to publish', value: verified }
    - { label: 'Published, but needs checking', value: needs-review }
    - { label: 'Not confirmed — hide from the website', value: unverified }
  hint: >-
    "Not confirmed" hides this from the public site entirely rather than
    publishing a guess. It will appear on the /review checklist instead.

collections:
  # ===========================================================================
  # 1. THE THINGS THAT CHANGE MOST OFTEN — put first on purpose
  # ===========================================================================

  - name: announcements
    label: 'Notices'
    label_singular: 'Notice'
    folder: src/content/announcements
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title.en}} — until {{showUntil}}'
    description: >-
      A one-line notice shown at the very top of every page. It REMOVES ITSELF
      on the date you set, so you never have to remember to take it down.
    fields:
      - { name: title, label: 'Notice', <<: *en_zh_text_both }
      - { name: body, label: 'A little more (optional)', <<: *en_zh_long, required: false }
      - name: showUntil
        label: 'Hide it after this date'
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: false
        hint: 'Required. The notice disappears by itself on this date.'
      - { name: href, label: 'Link to (optional)', widget: string, required: false, hint: 'e.g. /church-life' }
      - { name: linkLabel, label: 'Link text', <<: *en_zh_text, required: false }
      - name: tone
        label: 'Tone'
        widget: select
        default: info
        options:
          - { label: 'Information', value: info }
          - { label: 'Invitation', value: invite }
          - { label: 'Important', value: urgent }
      - { name: draft, label: 'Save as draft (not published)', widget: boolean, default: false }

  - name: events
    label: 'Events'
    label_singular: 'Event'
    folder: src/content/events
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{start}} — {{title.en}}'
    sortable_fields: ['start', 'title.en']
    description: >-
      You never need to delete a past event. Once its date has passed it stops
      showing under "What's coming up" and moves into the archive by itself.
    fields:
      - { name: title, label: 'Event name', <<: *en_zh_text_both }
      - { name: summary, label: 'One or two sentences', <<: *en_zh_long_both }
      - name: start
        label: 'Starts'
        widget: datetime
        picker_utc: false
      - name: end
        label: 'Ends (optional)'
        widget: datetime
        required: false
        picker_utc: false
      - { name: allDay, label: 'All day (hide the time)', widget: boolean, default: false }
      - { name: location, label: 'Where', <<: *en_zh_text, required: false }
      - name: image
        label: 'Photograph (optional)'
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: src, label: 'Image', widget: image, required: false }
          - name: alt
            label: 'Describe the photo for blind visitors'
            <<: *en_zh_text
            required: false
          - name: focus
            label: 'Focal point'
            widget: object
            required: false
            collapsed: true
            hint: 'Where the important part of the photo is, as a percentage. 50/50 is the centre.'
            fields:
              - { name: x, label: 'Across (%)', widget: number, default: 50, value_type: int, min: 0, max: 100 }
              - { name: y, label: 'Down (%)', widget: number, default: 50, value_type: int, min: 0, max: 100 }
      - { name: featured, label: 'Pin to the top / show on the homepage', widget: boolean, default: false }
      - name: audience
        label: 'Especially for'
        widget: select
        multiple: true
        default: ['everyone']
        options:
          - { label: 'Everyone', value: everyone }
          - { label: 'Students', value: students }
          - { label: 'Families', value: families }
          - { label: 'Children', value: children }
          - { label: 'Professionals / young adults', value: professionals }
          - { label: 'Seniors', value: seniors }
          - { label: 'English speakers', value: english }
          - { label: 'People visiting for the first time', value: newcomers }
      - { name: registerUrl, label: 'Sign-up link (optional)', widget: string, required: false, pattern: ['^https?://.+', 'Must start with https:// - paste the whole link out of your browser bar'] }
      - { name: registerLabel, label: 'Sign-up button text', <<: *en_zh_text, required: false }
      - { name: archive, label: 'Keep in the archive once it has passed', widget: boolean, default: true }
      - { name: draft, label: 'Save as draft (not published)', widget: boolean, default: false }

  - name: moments
    label: 'Church life photos'
    label_singular: 'Photo'
    folder: src/content/moments
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{caption.en}}'
    description: >-
      Photographs of ordinary church life, with captions. These do not expire —
      they are the part of the site that stays true.
    fields:
      - name: caption
        label: 'Caption'
        <<: *en_zh_text_both
        hint: 'Write it the way you would say it out loud. The best captions on this site are the funny ones.'
      - name: image
        label: 'Photograph'
        widget: object
        collapsed: false
        fields:
          - { name: src, label: 'Image', widget: image }
          - name: alt
            label: 'Describe the photo for blind visitors'
            <<: *en_zh_text_both
            hint: 'Say what is in the picture, plainly. "Twelve people around a table making mooncakes."'
          - name: focus
            label: 'Focal point'
            widget: object
            collapsed: true
            fields:
              - { name: x, label: 'Across (%)', widget: number, default: 50, value_type: int, min: 0, max: 100 }
              - { name: y, label: 'Down (%)', widget: number, default: 50, value_type: int, min: 0, max: 100 }
      - name: tags
        label: 'What is it about'
        widget: select
        multiple: true
        required: false
        options:
          [worship, meals, students, children, seniors, festival, retreat, sports, service, families, professionals, prayer]
      - name: weight
        label: 'Size in the mosaic'
        widget: select
        default: normal
        options:
          - { label: 'Normal', value: normal }
          - { label: 'Wide', value: wide }
          - { label: 'Tall', value: tall }
      - { name: order, label: 'Order (lower shows first)', widget: number, default: 50, value_type: int }
      - { name: draft, label: 'Save as draft (not published)', widget: boolean, default: false }

  - name: sermons
    label: 'Sermons'
    label_singular: 'Sermon'
    folder: src/content/sermons
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{date}} — {{title.en}}'
    sortable_fields: ['date']
    fields:
      - { name: title, label: 'Title', <<: *en_zh_text_both }
      - { name: date, label: 'Date preached', widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: false }
      - { name: speaker, label: 'Speaker', <<: *en_zh_text, required: false }
      - { name: passage, label: 'Bible passage', <<: *en_zh_text, required: false }
      - { name: series, label: 'Series', <<: *en_zh_text, required: false }
      - name: youtubeId
        label: 'YouTube video ID'
        widget: string
        required: false
        hint: 'Just the ID — the part after "watch?v=". For youtube.com/watch?v=abc123 enter abc123'
      - name: language
        label: 'Language preached in'
        widget: select
        default: mandarin
        options:
          - { label: 'Mandarin 华语', value: mandarin }
          - { label: 'English', value: english }
          - { label: 'Both', value: bilingual }
      - { name: summary, label: 'Summary (optional)', <<: *en_zh_long, required: false }
      - { name: draft, label: 'Save as draft (not published)', widget: boolean, default: false }

  # ===========================================================================
  # 2. THINGS THAT CHANGE OCCASIONALLY
  # ===========================================================================

  - name: fellowships
    label: 'Fellowships'
    label_singular: 'Fellowship'
    folder: src/content/fellowships
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name.en}} / {{name.zh}}'
    description: >-
      The groups where people actually belong. If you know when a group meets,
      please fill it in — a group with no meeting time is one nobody can join.
    fields:
      - { name: name, label: 'Name', <<: *en_zh_text_both }
      - { name: summary, label: 'One or two sentences', <<: *en_zh_long_both }
      - { name: audience, label: 'Who it is for', <<: *en_zh_text_both }
      - { name: meets, label: 'When and where it meets', <<: *en_zh_text, required: false }
      - { <<: *verification, name: meetsStatus, label: 'Is the meeting time confirmed?' }
      - { name: language, label: 'Language used', <<: *en_zh_text, required: false }
      - { name: contactName, label: 'Who to ask', <<: *en_zh_text, required: false }
      - { name: contactEmail, label: 'Their email (optional)', widget: string, required: false }
      - { <<: *verification, name: contactStatus, label: 'Is this contact still current?' }
      - name: accent
        label: 'Colour'
        widget: select
        default: lamp
        options:
          - { label: 'Amber', value: lamp }
          - { label: 'Terracotta', value: clay }
          - { label: 'Green', value: pine }
      - { name: featured, label: 'Show on the homepage', widget: boolean, default: true }
      - { name: order, label: 'Order (lower shows first)', widget: number, default: 50, value_type: int }
      - { name: draft, label: 'Save as draft (not published)', widget: boolean, default: false }

  - name: ministries
    label: 'Serving'
    label_singular: 'Ministry'
    folder: src/content/ministries
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name.en}} ({{state}})'
    description: >-
      Work the church gives itself to. Set "Currently running" so the site can
      be honest about what is happening now versus what happened in the past.
    fields:
      - { name: name, label: 'Name', <<: *en_zh_text_both }
      - { name: summary, label: 'One or two sentences', <<: *en_zh_long_both }
      - name: state
        label: 'Is this happening now?'
        widget: select
        default: active
        options:
          - { label: 'Yes — currently running', value: active }
          - { label: 'Seasonal / occasional', value: seasonal }
          - { label: 'No — a past record', value: past }
      - name: lastConfirmed
        label: 'Last known to be happening'
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
        picker_utc: false
      - { name: contactName, label: 'Who to ask', <<: *en_zh_text, required: false }
      - { name: order, label: 'Order', widget: number, default: 50, value_type: int }
      - { name: draft, label: 'Save as draft', widget: boolean, default: false }

  - name: faq
    label: 'Visitor questions'
    label_singular: 'Question'
    folder: src/content/faq
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{question.en}} [{{status}}]'
    description: >-
      Questions on the Visit page. Several are written but have no answer yet —
      those are hidden from the public site until someone fills them in.
      Answering "Where do I park?" would genuinely help a first-time visitor.
    fields:
      - { name: question, label: 'Question', <<: *en_zh_text_both }
      - { name: answer, label: 'Answer', <<: *en_zh_markdown_both }
      - name: topic
        label: 'Group it under'
        widget: select
        default: practical
        options:
          - { label: 'Getting there', value: arriving }
          - { label: 'What Sunday is like', value: sunday }
          - { label: 'Children', value: children }
          - { label: 'Language', value: language }
          - { label: 'Practical', value: practical }
          - { label: 'Belief', value: belief }
      - { <<: *verification }
      - { name: order, label: 'Order', widget: number, default: 50, value_type: int }

  - name: people
    label: 'Leaders'
    label_singular: 'Person'
    folder: src/content/people
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name.en}} — {{role.en}}'
    description: >-
      Nobody is listed yet, so the Leadership section does not appear on the
      site at all. Add people here and it appears. Please only add someone who
      has agreed to have their name published.
    fields:
      - { name: name, label: 'Name', <<: *en_zh_text_both }
      - { name: role, label: 'Role', <<: *en_zh_text_both }
      - { name: bio, label: 'A short introduction (optional)', <<: *en_zh_markdown, required: false }
      - { name: email, label: 'Email (optional)', widget: string, required: false, pattern: ['^\S+@\S+\.\S+$', 'That does not look like an email address'] }
      - name: group
        label: 'Group'
        widget: select
        default: pastoral
        options: [pastoral, staff, deacons, volunteers]
      - { name: order, label: 'Order', widget: number, default: 50, value_type: int }
      - name: draft
        label: 'Save as draft (not published)'
        widget: boolean
        default: true
        hint: 'Deliberately on by default — a real person’s name is never published by accident.'

  - name: pages
    label: 'Page text'
    label_singular: 'Page'
    folder: src/content/pages
    create: false
    delete: false
    slug: '{{slug}}'
    summary: '{{title.en}} [{{status}}]'
    description: >-
      Longer passages of writing used on the site. "What we believe" is empty
      and hidden — it needs text the church has actually approved.
    fields:
      - { name: title, label: 'Heading', <<: *en_zh_text_both }
      - { name: lede, label: 'Opening line', <<: *en_zh_long, required: false }
      - { name: body, label: 'Text', <<: *en_zh_markdown_both }
      - { <<: *verification }

  # ===========================================================================
  # 3. THE THINGS THAT ALMOST NEVER CHANGE — but must be easy when they do
  # ===========================================================================

  - name: settings
    label: 'Church details'
    files:
      - name: church
        label: 'Service times, address and giving'
        file: src/content/settings/church.yaml
        description: >-
          Change the Sunday time here and it updates everywhere on the site at
          once — the homepage, the Visit page, the footer, and the information
          Google shows in search results.
        fields:
          - name: entries
            label: 'Church'
            widget: list
            # church.yaml is a top-level YAML list, not a mapping. Without
            # this, the CMS opens the form EMPTY and the first save rewrites
            # the file nested under an "entries:" key, which fails the build.
            root: true
            allow_add: false
            max: 1
            fields:
              - { name: id, widget: hidden, default: church }
              - { name: name, label: 'Church name', <<: *en_zh_text_both }
              - { name: nameVariant, label: 'Alternative spelling', <<: *en_zh_text, required: false }
              - { name: established, label: 'Founded', widget: string }
              - { name: tagline, label: 'Tagline', <<: *en_zh_text_both }

              - name: address
                label: 'Address'
                widget: object
                fields:
                  - { name: line1, label: 'Street', widget: string }
                  - { name: city, label: 'City', widget: string }
                  - { name: state, label: 'State', widget: string }
                  - { name: zip, label: 'ZIP', widget: string }
                  - { name: note, label: 'Note about the building', <<: *en_zh_long, required: false }
                  - { name: mapsUrl, label: 'Google Maps link', widget: string, required: false, pattern: ['^https?://.+', 'Must start with https:// - paste the whole link out of your browser bar'] }
                  - { name: lat, label: 'Latitude', widget: number, required: false, value_type: float }
                  - { name: lng, label: 'Longitude', widget: number, required: false, value_type: float }

              - name: gatherings
                label: 'Regular gatherings'
                label_singular: 'Gathering'
                widget: list
                summary: '{{fields.name.en}} — {{fields.day}} {{fields.startTime}}'
                fields:
                  - { name: id, label: 'Short id', widget: string }
                  - { name: name, label: 'Name', <<: *en_zh_text_both }
                  - name: day
                    label: 'Day'
                    widget: select
                    options: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
                  - { name: startTime, label: 'Starts (24-hour, e.g. 11:00)', widget: string, pattern: ['^\d{2}:\d{2}$', 'Use HH:MM, e.g. 11:00 or 18:00'] }
                  - { name: endTime, label: 'Ends (24-hour)', widget: string, required: false, pattern: ['^\d{2}:\d{2}$', 'Use HH:MM'] }
                  - { name: location, label: 'Room', <<: *en_zh_text_both }
                  - name: address
                    label: 'Street address - ONLY if it does not meet at the church'
                    widget: object
                    required: false
                    collapsed: true
                    hint: 'Leave this empty for anything that meets at 1801 Gurley Avenue. The church address is set once, above.'
                    fields:
                      - { name: line1, label: 'Street', widget: string }
                      - { name: city, label: 'City', widget: string, default: 'Waco' }
                      - { name: state, label: 'State', widget: string, default: 'TX' }
                      - { name: zip, label: 'ZIP', widget: string }
                      - { name: mapsUrl, label: 'Map link', widget: string, required: false, pattern: ['^https?://.+', 'Must start with https:// - paste the whole link out of your browser bar'] }
                      - { name: note, label: 'Note about the location', <<: *en_zh_long, required: false }
                  - { name: addressOnRequest, label: 'Meets in a private home - how to ask for the address', <<: *en_zh_long, required: false, hint: 'Use this INSTEAD of a street address when a gathering meets in someone home. Never type a home address into this site: it would be published publicly and kept in the repository history forever.' }
                  - { name: online, label: 'Can it also be joined online?', <<: *en_zh_long, required: false }
                  - { name: summary, label: 'What happens', <<: *en_zh_long, required: false }
                  - name: schedule
                    label: 'Running order'
                    widget: list
                    required: false
                    summary: '{{fields.start}} {{fields.label.en}}'
                    fields:
                      - { name: start, label: 'From', widget: string }
                      - { name: end, label: 'To', widget: string, required: false }
                      - { name: label, label: 'What', <<: *en_zh_text_both }
                  - name: groups
                    label: 'Groups it splits into'
                    widget: list
                    required: false
                    collapsed: false
                    summary: '{{fields.name.en}}'
                    hint: 'The Friday Bible study splits into three. Leave this empty for a gathering that does not split.'
                    fields:
                      - { name: name, label: 'Group name', <<: *en_zh_text_both }
                      - { name: audience, label: 'Who it is for', <<: *en_zh_long_both }
                      - { name: note, label: 'Anything else', <<: *en_zh_long, required: false }
                  - { name: languages, label: 'Language note', <<: *en_zh_long, required: false }
                  - { <<: *verification }
                  - { name: featured, label: 'Show prominently', widget: boolean, default: true }

              - name: contact
                label: 'Contact'
                widget: object
                fields:
                  - { name: email, label: 'Email', widget: string, required: false, pattern: ['^\S+@\S+\.\S+$', 'That does not look like an email address'] }
                  - { <<: *verification, name: emailStatus, label: 'Email confirmed?' }
                  - { name: phone, label: 'Phone', widget: string, required: false }
                  - { <<: *verification, name: phoneStatus, label: 'Phone confirmed?', default: unverified }
                  # The Web3Forms key that switches the contact form on.
                  #
                  # Declared so a volunteer can paste the key in without a developer,
                  # which is what docs/DEPLOY.md promises. (An earlier note here claimed
                  # an undeclared field would be DELETED on save. That was wrong:
                  # Sveltia's serializer ends with "Move the remainder, if any" and
                  # copies every key it does not recognise straight through. This field
                  # is declared because it should be editable, not because anything was
                  # ever at risk.)
                  - { name: formKey, label: 'Contact form key (Web3Forms)', widget: string, required: false, hint: 'Public by design — it is visible in the page source. Leave as WEB3FORMS_ACCESS_KEY_HERE until a real key arrives; the form stays hidden until then.' }

              - name: social
                label: 'Social channels'
                widget: list
                required: false
                summary: '{{fields.platform}} — {{fields.url}}'
                fields:
                  - { name: platform, label: 'Platform', widget: string }
                  - { name: label, label: 'Label', <<: *en_zh_text, required: false }
                  - { name: url, label: 'Link', widget: string, pattern: ['^https?://.+', 'Must start with https:// - paste the whole link out of your browser bar'] }
                  - { <<: *verification }

              - name: giving
                label: 'Ways to give'
                widget: list
                required: false
                summary: '{{fields.method.en}}'
                fields:
                  - { name: id, label: 'Short id', widget: string }
                  - { name: method, label: 'Method', <<: *en_zh_text_both }
                  - { name: detail, label: 'Explanation', <<: *en_zh_long_both }
                  - name: value
                    label: 'Where the money goes'
                    widget: string
                    required: false
                    hint: 'e.g. the Zelle email address. This is shown to the public with a clear label — never leave it to be guessed.'
                  - { name: instructions, label: 'Extra instructions', <<: *en_zh_long, required: false }
                  - { <<: *verification }

              - name: partners
                label: 'Partner churches'
                widget: list
                required: false
                summary: '{{fields.name.en}}'
                fields:
                  - { name: name, label: 'Name', <<: *en_zh_text_both }
                  - { name: url, label: 'Website', widget: string, required: false, pattern: ['^https?://.+', 'Must start with https:// - paste the whole link out of your browser bar'] }
                  - { name: relationship, label: 'The relationship', <<: *en_zh_long_both }
                  - { name: since, label: 'Since', widget: string, required: false }

  - name: timeline
    label: 'Church history'
    files:
      - name: timeline
        label: 'Our story'
        file: src/content/timeline/timeline.yaml
        description: 'The timeline on the About page.'
        fields:
          - name: entries
            label: 'Moments in our history'
            widget: list
            # timeline.yaml is a top-level YAML list — see the note in
            # "Church details" above. Same trap, same one-line fix.
            root: true
            summary: '{{fields.year}} — {{fields.title.en}}'
            fields:
              - { name: id, label: 'Short id', widget: string }
              - { name: year, label: 'Year', widget: string, hint: 'Just the number. It is what puts the moments in order.' }
              - { name: label, label: 'Show this instead of the year (optional)', <<: *en_zh_text, required: false, hint: 'For a moment that is not named by its number, e.g. Today.' }
              - { name: title, label: 'Heading', <<: *en_zh_text_both }
              - { name: body, label: 'What happened', <<: *en_zh_markdown_both }
              - { <<: *verification }
