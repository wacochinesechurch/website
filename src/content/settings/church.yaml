# =============================================================================
# CHURCH SETTINGS — the facts that appear across the whole site.
#
# Change the Sunday start time here and it updates the homepage, the Visit
# page, the footer, the structured data Google reads, and every other place
# it appears. There is exactly one copy of each fact.
#
# `status` on a field means:
#   verified     — confirmed by the church, safe to publish
#   needs-review — published, but listed on /review for someone to confirm
#   unverified   — NOT published; the site omits it rather than guessing
#
# Every fact below is sourced from wacochinesechurch.org unless noted.
# Audited 2026-09-21.
# =============================================================================

- id: church

  name:
    en: Waco Chinese Church
    zh: 韦科华人教会
  # The church’s own materials use 韦城华人教会 in the historical narrative
  # and on the 25th-anniversary video. Both are in use; the interface
  # standardises on 韦科 (the logo/footer form) and notes 韦城 in the history.
  nameVariant:
    en: ""
    zh: 韦城华人教会

  established: "1993"

  tagline:
    en: A home for people far from home.
    zh: 离家再远，这里也有个家。

  address:
    # Spelled out in full, not abbreviated to Ave. Visiting speakers and
    # preachers have needed to read this address aloud and type it into a
    # map, and the abbreviation cost them time.
    line1: 1801 Gurley Avenue
    city: Waco
    state: TX
    zip: "76706"
    note:
      en: We’re non-denominational, and share this building with Emmanuel Baptist Church, our partner congregation.
      zh: 我们不属于任何宗派，与伙伴教会以马内利浸信会共用这栋建筑。
    mapsUrl: https://www.google.com/maps/search/?api=1&query=1801+Gurley+Avenue%2C+Waco%2C+TX+76706
    lat: 31.5375467
    lng: -97.1342783

  # ---------------------------------------------------------------------------
  # GATHERINGS — the answer to "when do they meet?"
  # ---------------------------------------------------------------------------
  gatherings:
    - id: sunday
      name:
        en: Sunday Worship
        zh: 主日崇拜
      day: sunday
      startTime: "11:00"
      endTime: "12:30"
      location:
        en: The Sanctuary
        zh: 主堂
      summary:
        en: The whole church worships together, with a message from Scripture and time to talk afterwards. During the message, younger children are welcome to go to their own group, and just as welcome to stay with you.
        zh: 全教会一同敬拜，有出于圣经的证道，聚会后还有彼此交谈的时间。讲道的时段，年纪较小的孩子可以去自己的聚会，也可以留在父母身边。
      schedule:
        - start: "11:00"
          end: "11:30"
          label:
            en: Worship in song
            zh: 诗歌敬拜
        - start: "11:30"
          end: "12:30"
          label:
            en: A message from Scripture. Children may go to their own group.
            zh: 证道，孩子可以去自己的聚会
      languages:
        en: Worship is in Mandarin. If you don’t understand it, someone will bring you headphones and interpret into English. You won’t have to ask.
        zh: 崇拜以华语进行。若您听不懂，会有弟兄姊妹为您送上耳机，翻译成英文，无需您开口询问。
      status: verified
      featured: true

    - id: friday
      name:
        en: Friday Bible Study
        zh: 周五查经
      day: friday
      startTime: "18:00"
      endTime: "20:30"
      location:
        en: The Fellowship Hall
        zh: 团契厅
      summary:
        en: 'Dinner first, then worship in song, then Bible study in three groups: students, working adults, and English speakers. Come for any part of it.'
        zh: 先一同用晚餐，然后诗歌敬拜，接着分为三个小组查经：大学生组、职青组与英文组。欢迎您参加其中任何一段。
      schedule:
        - start: "18:00"
          end: "18:45"
          label:
            en: Dinner together
            zh: 爱心晚餐
        - start: "18:45"
          end: "19:15"
          label:
            en: Worship in song
            zh: 赞美敬拜
        - start: "19:15"
          end: "20:30"
          label:
            en: Bible study, in three groups
            zh: 分组查经
      groups:
        - name:
            en: Baylor Bible Bears (BBB)
            zh: 大学生组（BBB）
          audience:
            en: Baylor and Waco college students
            zh: Baylor 与韦科的大学生
        - name:
            en: Young Professional Group
            zh: 职青组
          audience:
            en: Working adults and young professionals
            zh: 职场人士与青年专业人士
        - name:
            en: English-speaking group
            zh: 英文组
          audience:
            en: Anyone who would rather study in English
            zh: 希望以英文查经的朋友
      languages:
        en: Mandarin, with a group that studies in English.
        zh: 华语，英文组用英文查经
      status: verified
      featured: true

    - id: prayer-tuesday
      name:
        en: Prayer Meeting
        zh: 祷告会
      day: tuesday
      startTime: "19:30"
      endTime: "20:45"
      location:
        en: At the church, or online
        zh: 教会现场，或线上参加
      online:
        en: This one can be joined online as well as in person.
        zh: 这场祷告会可以到现场，也可以在线上参加。
      summary:
        en: The church praying together. Come in person or join online. If you would like others to pray for something, you can send a request in beforehand.
        zh: 全教会一同祷告。您可以到教会现场，也可以在线上参加。若有代祷事项，可以事先提交，让弟兄姊妹为您祷告。
      languages:
        en: Mandarin.
        zh: 用华语
      status: verified
      featured: false

    - id: prayer-wednesday
      name:
        en: 'Prayer Meeting: Baylor Bible Bears'
        zh: 祷告会：大学生组（BBB）
      day: wednesday
      startTime: "19:30"
      endTime: "20:30"
      location:
        en: A member’s home near Baylor, not at the church
        zh: Baylor 附近弟兄姊妹的家中，不在教会
      # The street address is deliberately not stored here. It is a private
      # home, this repository is on GitHub, and git history cannot be undone.
      # Whoever is hosting sends it to people who ask — which also means the
      # site never goes stale when the host changes.
      addressOnRequest:
        en: This one meets at a member’s home rather than at the church, so we send the address out rather than posting it. Email us and we’ll pass it on. You’re very welcome to come.
        zh: 这场祷告会在弟兄姊妹的家中举行，而不在教会，因此我们不公开张贴地址。请来信与我们联系，我们会把地址发给您。诚挚欢迎您来参加。
      summary:
        en: The college group praying together, midweek.
        zh: 大学生组在周间一同祷告。
      languages:
        en: Mandarin.
        zh: 用华语
      status: verified
      featured: false

  # ---------------------------------------------------------------------------
  # CONTACT
  # ---------------------------------------------------------------------------
  contact:
    email: wacochinesechurch@gmail.com
    emailStatus: verified
    # No telephone number is published anywhere by the church. Rather than
    # invent one, the site simply does not offer a phone route.
    phone: ""
    phoneStatus: unverified
    # Web3Forms access key for the contact form. Free and needs no account:
    # enter the church's address at web3forms.com and the key arrives by
    # email. Safe in the page source, because it can only send TO that
    # address. Replace the placeholder or the form will not work, and
    # `npm run preflight` will refuse to pass until you do.
    formKey: WEB3FORMS_ACCESS_KEY_HERE

  # ---------------------------------------------------------------------------
  # SOCIAL / MEDIA CHANNELS — only channels confirmed to belong to WCC.
  # ---------------------------------------------------------------------------
  social:
    - platform: youtube
      label:
        en: Waco Chinese Church Media
        zh: YouTube 频道
      url: https://www.youtube.com/@wacochinesechurchmedia1963
      # Nothing has been published to this channel since 2023-12-10. It is
      # linked because it holds the church’s back catalogue, but it is not a
      # live feed and the site must not imply otherwise.
      status: needs-review

  # ---------------------------------------------------------------------------
  # GIVING
  # ---------------------------------------------------------------------------
  giving:
    - id: zelle
      method:
        en: Zelle
        zh: Zelle 转账
      detail:
        en: Send through your own bank’s Zelle service to the church email address.
        zh: 通过您所属银行的 Zelle 服务，转账至教会的电子邮箱。
      value: wacochinesechurch@gmail.com
      instructions:
        en: Most US banks include Zelle in their app. Add the address above as the recipient.
        zh: 美国多数银行的手机应用都内建 Zelle，将上述邮箱加为收款人即可。
      status: verified

    - id: check
      method:
        en: Check by mail
        zh: 邮寄支票
      detail:
        en: Mail to Waco Chinese Church, 1801 Gurley Avenue, Waco, TX 76706.
        zh: 邮寄至 Waco Chinese Church, 1801 Gurley Avenue, Waco, TX 76706。
      value: ""
      instructions:
        en: Please email us first to confirm exactly who to make the check payable to.
        zh: 开票前请先来信，与我们确认支票抬头应填写的名称。
      status: needs-review

    - id: inperson
      method:
        en: In person
        zh: 现场奉献
      detail:
        en: Cash given at the church is welcome.
        zh: 欢迎在教会现场以现金奉献。
      value: ""
      status: verified

  # ---------------------------------------------------------------------------
  # PARTNERS — a partnership, explicitly NOT a denominational affiliation.
  # Waco Chinese Church is non-denominational.
  # ---------------------------------------------------------------------------
  partners:
    - name:
        en: Emmanuel Baptist Church
        zh: 以马内利浸信会
      relationship:
        en: Our host and partner congregation since 1995, and formally covenanted partner churches since 2018. We share this building, and share work in Waco and in mission.
        zh: 自 1995年起接待我们的教会，2018年正式签约成为伙伴教会。我们共用这栋建筑，也一同服事韦科本地与宣教工场。
      since: "1995"
