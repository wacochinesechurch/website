# =============================================================================
# CHURCH HISTORY
#
# Every entry below is drawn from the church's own About page, in both its
# Chinese and English versions. Where the two versions differ, that is noted
# in a comment — and where a detail appears in only one language, it has been
# carried into both here so neither audience gets a thinner story.
#
# Nothing has been added. No dates, names or numbers are inferred.
# =============================================================================

- id: "1993"
  year: "1993"
  title:
    en: A fellowship begins at Baylor
    zh: 一个团契在 Baylor 开始
  body:
    en: |
      In December 1993, an evangelist known as Brother Tuan traveled to Baylor
      with a group of students from a fellowship in Austin, and together they
      started a monthly evangelistic gathering on campus. This was the Baylor
      University Chinese Students and Scholars Fellowship.

      There was no building, no staff and no budget. There was a room, a
      handful of people, and a willingness to keep showing up.
    zh: |
      1993 年 12 月，传道人段弟兄带着一群来自德州大学团契的学生来到 Baylor，
      在校园里开始了每月一次的布道聚会。这就是 Baylor 大学中国学生学者团契，
      也是韦科华人教会的前身。

      那时没有会堂，没有专职同工，也没有经费。有的只是一间房间、几个人，
      和一份持续出现的心意。
  status: verified

- id: "1994"
  year: "1994"
  title:
    en: Sunday worship starts in an apartment
    zh: 主日崇拜从一间公寓开始
  body:
    en: |
      By late 1994 the new Chinese Christians at Baylor had begun meeting for
      Sunday worship in an apartment near campus.
    zh: |
      到了 1994 年底，Baylor 这群刚信主的华人基督徒，开始在校园附近的一间公寓里
      举行主日崇拜。
  # Note: this detail appears only in the English version of the church's
  # About page. The Chinese version moves straight from 1993 to 1995.
  status: verified

- id: "1995"
  year: "1995"
  title:
    en: Emmanuel Baptist Church opens its doors
    zh: 以马内利浸信会敞开大门
  body:
    en: |
      In the early spring of 1995, Emmanuel Baptist Church offered the group a
      home at 1801 Gurley Avenue.

      They have worshipped in this building ever since. It is why a church
      founded by Chinese students meets in a Baptist church's sanctuary:
      hospitality, offered early and never withdrawn.
    zh: |
      1995 年初，蒙以马内利浸信会的扶持，
      这群人搬进了 Gurley 大道 1801 号，并在那里开始了主日崇拜。

      从那时起至今，我们一直在这栋建筑里敬拜。一间由华人学生创立的教会，
      为什么会在一间浸信会的礼堂中聚会？答案是：有人很早就敞开了门，
      而且从未关上。
  status: verified

- id: "2018"
  year: "2018"
  title:
    en: Twenty-five years, and a covenant
    zh: 二十五年，与一纸盟约
  body:
    en: |
      In 2018 Emmanuel Baptist Church and Waco Chinese Church formally signed
      an agreement to become partner churches, pooling resources to serve
      Waco and to support mission work beyond it.

      By its twenty-fifth year the church had grown from around ten regular
      attenders to more than a hundred.
    zh: |
      2018 年，以马内利浸信会与韦科华人教会正式签约成为伙伴教会，
      汇集资源，一同服事本地社区以及宣教工场。

      到教会的第二十五年，聚会人数已从最初约十人，增长到一百多人。
  # The "10 → 100+" figure is the church's own, stated in the context of its
  # 25th year (i.e. around 2018). It is placed here rather than presented as
  # a current number, which would be an unverified claim.
  status: verified

- id: "today"
  year: "2026"
  label: { en: "Today", zh: "今天" }
  title:
    en: Wave after wave
    zh: 一波又一波
  body:
    en: |
      Over the years this church has welcomed and sent off wave after wave of
      students, scholars and friends. Many have come to faith here and call
      this place their spiritual birthplace, a home away from home. Some have
      gone on to serve in churches and mission fields around the world.

      Most Sundays it is simpler than that. It is a room with worship in it,
      and somebody noticing you are new.
    zh: |
      多年以来，教会迎送了一波又一波的学生、学者和朋友。
      许多人在这里认识了主，称这里为自己属灵的出生地，也是异乡里的一个家。
      其中不少人后来去到各地的教会与宣教工场服事。

      而大多数的主日，其实比这些都简单：一个有敬拜的房间，
      以及有人注意到你是新来的。
  status: verified
