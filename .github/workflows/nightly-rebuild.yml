name: Nightly rebuild

# WHY THIS EXISTS
#
# A static site built on Tuesday still believes it is Tuesday. Two of the
# three anti-staleness layers already work without this:
#
#   1. Build time  — getUpcomingEvents() drops anything already finished
#   2. Read time   — src/scripts/freshness.ts re-checks in the visitor's
#                    browser, so a human always sees the truth
#
# But the HTML that Google, Bing and link-preview bots read is whatever was
# generated at the last build. Without a rebuild, a crawler can keep seeing a
# finished event listed as upcoming — which is exactly how the previous site
# ended up advertising a Lunar New Year party in September.
#
# This is layer 3. It asks Netlify to rebuild once a day. Nothing else.

on:
  schedule:
    # 09:00 UTC — about 3am or 4am in Waco depending on daylight saving.
    # Quiet hours either way.
    - cron: '0 9 * * *'
  # Lets anyone with repo access trigger a rebuild by hand from the Actions
  # tab, which is handy if content looks stale and you do not want to wait.
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the host to rebuild
        env:
          # A Cloudflare Pages Deploy hook, from the project's Settings → Build
          # → Deploy hooks. It is just a URL you POST to, so any host that
          # offers the same thing (Netlify calls it a Build hook) drops in
          # without touching this file.
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::No deploy hook set. The daily rebuild is doing nothing."
            echo "Add DEPLOY_HOOK_URL under Settings → Secrets and variables → Actions."
            exit 1
          fi
          code=$(curl -fsS -o /dev/null -w '%{http_code}' -X POST -d '{}' "$HOOK")
          echo "Host responded $code"
          echo
          echo "A 2xx means the hook was ACCEPTED, not that anything was published."
          echo "Check Cloudflare's own Deployments list before trusting a green"
          echo "tick here."
          echo
          echo "Cost: one build a day out of 500 free a month, about 6%. This"
          echo "used to run against Netlify, where a deploy cost a flat 15"
          echo "credits out of 300 a month — 450 a month for this job alone, so"
          echo "the free plan could not survive a month even with nobody"
          echo "touching the repo. That is why the site moved."
